<!DOCTYPE html>
<html>
<head>
    <title>Timetable</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Weekly Timetable</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>Subject</th>
            <th>Time</th>
        </tr>

        {% for item in data %}
        <tr>
            <td>{{ item.day }}</td>
            <td>{{ item.subject }}</td>
            <td>{{ item.time }}</td>
        </tr>
        {% endfor %}

    </table>
</div>

</body>
</html>
